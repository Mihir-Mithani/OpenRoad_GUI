[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-gui"
version = "1.0.0"
description = "OpenROAD Flow GUI - RTL-to-GDSII automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stable-baselines3[extra]",
    "gymnasium",
    "torch",
    "pandas",
    "polars",
    "joblib",
    "lightgbm",
    "scikit-learn==1.9.1",
    "onnx",
    "onnxruntime",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openroad_gui*"]
