name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python, Tkinter, and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pytest

      - name: Verify Python and Tkinter
        run: python3 -c "import tkinter; print(tkinter.TkVersion)"

      - name: Run test suite
        run: python3 -m pytest -q
